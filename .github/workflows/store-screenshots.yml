name: App Store screenshots
on:
  pull_request:
    paths:
      - 'scripts/store/**'
      - '.github/workflows/store-screenshots.yml'
  workflow_dispatch:
    inputs:
      runtime_run_id:
        description: 'Successful iOS validation run to reuse; 0 forces a fresh compile'
        required: false
        default: '38172062053'
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: iPhone, Duo and iPad Flutter captures
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Install screenshot dependencies
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          npm ci
          npm ci --prefix functions
          npm run build:functions
          flutter pub get --enforce-lockfile
      - name: Check validated native runtime inputs
        id: runtime-check
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          STORE_RUNTIME_RUN: ${{ inputs.runtime_run_id || '38172062053' }}
        run: python3 scripts/store/check-runtime.py
      - name: Download matching simulator runtime
        if: steps.runtime-check.outcome == 'success'
        id: runtime-download
        continue-on-error: true
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.runtime_run_id || '38172062053' }}
          pattern: ios-staging-simulator-*
          merge-multiple: true
          path: tmp/native-runtime
      - name: Compile current UI for the validated runtime
        if: steps.runtime-download.outcome == 'success'
        run: |
          flutter assemble --output=build/flutter_assets -dBuildMode=debug -dTargetPlatform=ios -dConfiguration=Debug-staging -dTargetFile=scripts/store/capture.dart --dart-define-from-file=config/ios/staging.json copy_flutter_bundle
          python3 scripts/store/prepare-runtime.py
      - name: Compile fresh native screenshot app
        if: steps.runtime-download.outcome != 'success'
        run: |
          flutter build ios --simulator --debug --flavor staging --dart-define-from-file=config/ios/staging.json --target scripts/store/capture.dart
      - name: Capture iPhone, Duo outer and inner, and iPad layouts
        env:
          GCLOUD_PROJECT: demo-pluto-ticketing
        run: npx --yes firebase-tools@15.32.1 emulators:exec --project demo-pluto-ticketing --config firebase.ticketing-test.json --only auth,firestore,storage "python3 scripts/store/capture-ios.py"
      - name: Keep screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-screenshots-${{ github.sha }}
          path: |
            output/app-store-screenshots/
            tmp/store-capture-app.log
          if-no-files-found: warn
          retention-days: 30
