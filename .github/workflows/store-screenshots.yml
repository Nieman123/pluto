name: App Store screenshots
on:
  pull_request:
    paths:
      - 'scripts/store/**'
      - '.github/workflows/store-screenshots.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: store-screenshots-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    name: iPhone, Duo and iPad Flutter captures
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Build isolated native screenshot app
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app/Contents/Developer
          npm ci
          npm ci --prefix functions
          npm run build:functions
          flutter pub get --enforce-lockfile
          flutter build ios --simulator --debug --flavor staging --dart-define-from-file=config/ios/staging.json --target scripts/store/capture.dart
      - name: Capture iPhone, Duo outer and inner, and iPad layouts
        env:
          GCLOUD_PROJECT: demo-pluto-ticketing
        run: npx --yes firebase-tools@15.32.1 emulators:exec --project demo-pluto-ticketing --config firebase.ticketing-test.json --only auth,firestore,storage "python3 scripts/store/capture-ios.py"
      - name: Keep screenshots and capture diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-store-screenshots-${{ github.sha }}
          path: |
            output/app-store-screenshots/
            tmp/store-capture-app.log
          if-no-files-found: warn
          retention-days: 30
