name: Android internal testing
on:
  workflow_dispatch:
    inputs:
      environment:
        description: App/backend environment
        type: choice
        options: [staging, production]
        default: staging
        required: true
      operation:
        description: Build the first signed bundle, or update an existing internal test
        type: choice
        options: [build-only, publish-internal]
        default: build-only
        required: true
      revision:
        description: Full 40-character SHA merged into main
        type: string
        required: true
  workflow_run:
    workflows: [Release]
    types: [completed]
    branches: [main]
permissions:
  contents: read
  actions: read
  deployments: read
concurrency:
  group: play-internal-${{ github.event_name == 'workflow_dispatch' && inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  selection:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ANDROID_STAGING_AUTO_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.select.outputs.enabled }}
      environment: ${{ steps.select.outputs.environment }}
      revision: ${{ steps.select.outputs.revision }}
      operation: ${{ steps.select.outputs.operation }}
      source: ${{ steps.select.outputs.source }}
      versionCode: ${{ steps.select.outputs.versionCode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install release policy helpers
        run: |
          npm ci --prefix functions
          npm run build:functions
      - name: Select a trusted revision and validated staging deployment
        id: select
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PLAY_ENVIRONMENT: ${{ inputs.environment }}
          PLAY_OPERATION: ${{ inputs.operation }}
          PLAY_REVISION: ${{ inputs.revision }}
          ANDROID_STAGING_AUTO_PUBLISH: ${{ vars.ANDROID_STAGING_AUTO_PUBLISH }}
        run: node scripts/android/select-play-release.mjs
  validation:
    needs: selection
    # Automatic runs reuse the upstream Release's successful full validation.
    if: ${{ needs.selection.outputs.enabled == 'true' && needs.selection.outputs.source == 'manual' }}
    uses: ./.github/workflows/validate.yml
    with:
      revision: ${{ needs.selection.outputs.revision }}
  bundle:
    needs: [selection, validation]
    if: ${{ always() && needs.selection.result == 'success' && needs.selection.outputs.enabled == 'true' && (needs.validation.result == 'success' || (needs.validation.result == 'skipped' && needs.selection.outputs.source == 'validated-staging-release')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: ${{ needs.selection.outputs.environment }}
    env:
      PLAY_ENVIRONMENT: ${{ needs.selection.outputs.environment }}
      PLAY_REVISION: ${{ needs.selection.outputs.revision }}
      PLAY_OPERATION: ${{ needs.selection.outputs.operation }}
      PLUTO_UNSIGNED_VALIDATION: 'false'
      PLUTO_UPLOAD_KEY_ALIAS: ${{ vars.ANDROID_UPLOAD_KEY_ALIAS || 'pluto-upload' }}
      ANDROID_UPLOAD_CERT_SHA256: ${{ vars.ANDROID_UPLOAD_CERT_SHA256 }}
      PRODUCTION_APPROVAL_POLICY: ${{ vars.PRODUCTION_APPROVAL_POLICY || 'two-person' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.PLAY_REVISION }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: '3.47.5'
          channel: stable
          cache: true
      - name: Configure locked native toolchain and release helpers
        run: |
          sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdk_manager" ]; then
            for candidate in "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager; do
              if [ -x "$candidate" ]; then sdk_manager="$candidate"; break; fi
            done
          fi
          if [ ! -x "$sdk_manager" ]; then echo '::error::Android SDK command-line tools missing.'; exit 1; fi
          flutter config --android-sdk="$ANDROID_HOME"
          flutter config --jdk-dir="$JAVA_HOME"
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'platforms;android-36' 'build-tools;36.0.0'
          flutter pub get --enforce-lockfile
          npm ci --prefix functions
          npm run build:functions
      - name: Verify release identity, backend evidence and upload certificate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          PLUTO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          PLUTO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: node scripts/android/prepare-play-build.mjs
      - name: Build signed release bundle
        env:
          ANDROID_VERSION_CODE: ${{ needs.selection.outputs.versionCode }}
          PLUTO_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
          PLUTO_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: flutter build appbundle --release --flavor "$PLAY_ENVIRONMENT" --dart-define-from-file="config/android/$PLAY_ENVIRONMENT.json" --build-number="$ANDROID_VERSION_CODE"
      - name: Verify signing and 16 KB native libraries
        run: |
          node scripts/android/verify-play-build.mjs
          python3 -m unittest discover -s scripts/android -p 'test_*.py'
          python3 scripts/android/verify_bundle.py "build/app/outputs/bundle/${PLAY_ENVIRONMENT}Release/app-${PLAY_ENVIRONMENT}-release.aab"
      - name: Authenticate dedicated Play publisher
        if: ${{ env.PLAY_OPERATION == 'publish-internal' }}
        id: play-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/androidpublisher
          create_credentials_file: false
          export_environment_variables: false
      - name: Publish to internal testing only
        if: ${{ env.PLAY_OPERATION == 'publish-internal' }}
        env:
          GOOGLE_PLAY_ACCESS_TOKEN: ${{ steps.play-auth.outputs.access_token }}
        run: node scripts/android/publish-internal.mjs
      - name: Keep signed bundle and public release evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: play-${{ env.PLAY_ENVIRONMENT }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            build/app/outputs/bundle/${{ env.PLAY_ENVIRONMENT }}Release/app-${{ env.PLAY_ENVIRONMENT }}-release.aab
            tmp/android-release/manifest.json
            tmp/android-release/play-result.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove runner upload keystore
        if: ${{ always() }}
        run: node scripts/android/cleanup-play-signing.mjs
