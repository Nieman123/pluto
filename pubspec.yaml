name: pluto
description: private underground events

publish_to: 'none'

version: 1.0.2+2

environment:
  sdk: ">=3.13.7 <4.0.0"
  flutter: ">=3.47.8"

dependencies:
  flutter_web_plugins:
    sdk: flutter
  flutter:
    sdk: flutter
  firebase_analytics: 12.6.1
  firebase_core: 4.15.1
  firebase_core_web: ^3.12.0
  firebase_auth: 6.7.1
  cloud_firestore: 6.10.1
  file_picker: ^10.3.2
  url_launcher: ^6.1.7
  firebase_messaging: 16.7.1
  firebase_storage: 13.6.1
  flutter_native_splash: ^2.3.1
  intl: any
  go_router: ^16.1.0
  flutter_widget_from_html: ^0.16.1
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  http: ^1.6.0
  cryptography: ^2.9.0
  connectivity_plus: ^7.3.1
  path_provider: ^2.1.6
  web: ^1.1.1
  flutter_secure_storage: 10.3.4
  google_sign_in: ^7.2.0
  app_links: ^7.2.2
  package_info_plus: ^9.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  config:
    enable-swift-package-manager: false
  uses-material-design: true

  fonts:
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-SemiBold.ttf
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Medium.ttf

  assets:
    - assets/home/constant/email.png
    - assets/home/constant/facebook.png
    - assets/home/constant/instagram.png
    - assets/home/constant/link.png
    - assets/home/constant/tiktok.png
    - assets/experience/pluto-logo-small.webp
    - assets/events/Mana-Fest-2026-Flyer-half.webp
    - assets/events/manafest-2026-lineup-v2.webp
    - site/content/manafest.json
    - assets/rentals/initial-inventory.json
